    html, body {

      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      padding: 2px;
      box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.22);
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.4;
    }
    .marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 12px;
      color: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.32);
      border: 2.5px solid white;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .marker-pin.active-pin {
      transform: scale(1.3);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.5), 0 6px 14px rgba(0,0,0,0.38);
      z-index: 1000 !important;
    }
    .origin-pulse {
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.65); }
      70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .leaflet-top.leaflet-left {
      top: 68px;
      left: 6px;
    }

    function buildBerkeleyVectorGrid() {
      const group = L.layerGroup();

      L.polygon([
        [37.910, -122.330],
        [37.910, -122.306],
        [37.885, -122.307],
        [37.865, -122.306],
        [37.840, -122.304],
        [37.840, -122.330]
      ], { color: "#93c5fd", weight: 1, fillColor: "#dbeafe", fillOpacity: 0.7, interactive: false }).addTo(group);

      L.polygon([
        [37.8652, -122.3025],
        [37.8652, -122.3005],
        [37.8540, -122.2975],
        [37.8540, -122.3000]
      ], { color: "#93c5fd", weight: 1, fillColor: "#bfdbfe", fillOpacity: 0.65, interactive: false }).addTo(group);

      L.polygon([
        [37.8758, -122.2662],
        [37.8758, -122.2510],
        [37.8692, -122.2510],
        [37.8692, -122.2662]
      ], { color: "#86efac", weight: 1.5, dashArray: "4,4", fillColor: "#dcfce7", fillOpacity: 0.55, interactive: false }).addTo(group);

      const streets = [
        { name: "Fourth St", weight: 4, color: "#94a3b8", coords: [[37.8760, -122.3033], [37.8693, -122.3011], [37.8669, -122.3001], [37.8617, -122.2981], [37.8570, -122.2962]], labelPos: [37.8732, -122.3022] },
        { name: "San Pablo Ave", weight: 4.5, color: "#94a3b8", coords: [[37.9000, -122.2990], [37.8680, -122.2921], [37.8515, -122.2861], [37.8400, -122.2820]], labelPos: [37.8790, -122.2950] },
        { name: "University Ave", weight: 5, color: "#94a3b8", coords: [[37.8662, -122.3035], [37.8673, -122.2998], [37.8691, -122.2941], [37.8702, -122.2849], [37.8719, -122.2729], [37.8726, -122.2662]], labelPos: [37.8698, -122.2885] },
        { name: "Shattuck Ave", weight: 4.5, color: "#94a3b8", coords: [[37.8940, -122.2715], [37.8728, -122.2687], [37.8650, -122.2673], [37.8500, -122.2655]], labelPos: [37.8810, -122.2698] },
        { name: "Telegraph Ave", weight: 4, color: "#94a3b8", coords: [[37.8692, -122.2591], [37.8665, -122.2591], [37.8500, -122.2602]], labelPos: [37.8610, -122.2595] },
        { name: "College Ave", weight: 4, color: "#94a3b8", coords: [[37.8692, -122.2542], [37.8576, -122.2533], [37.8480, -122.2525]], labelPos: [37.8625, -122.2536] },
        { name: "Solano Ave", weight: 3.5, color: "#94a3b8", coords: [[37.8905, -122.2985], [37.8914, -122.2768], [37.8918, -122.2710]], labelPos: [37.8911, -122.2865] }
      ];

      streets.forEach(st => {
        L.polyline(st.coords, { color: st.color, weight: st.weight + 2, opacity: 0.9, interactive: false }).addTo(group);
        L.polyline(st.coords, { color: "#ffffff", weight: Math.max(1.5, st.weight - 1), opacity: 0.95, interactive: false }).addTo(group);
        if (st.labelPos) {
          L.marker(st.labelPos, {
            interactive: false,
            icon: L.divIcon({
              className: "",
              html: `<div style="font-size:10px;font-weight:600;color:#475569;background:rgba(255,255,255,0.85);padding:1px 4px;border-radius:3px;white-space:nowrap;border:1px solid #e2e8f0;">${st.name}</div>`,
              iconSize: [90, 14],
              iconAnchor: [45, 7]
            })
          }).addTo(group);
        }
      });

      return group;
    }

    function setBasemap(mode) {
      if (!map) return;
      if (currentTileLayer) {
        map.removeLayer(currentTileLayer);
        currentTileLayer = null;
      }
      if (vectorOverlayGroup) {
        map.removeLayer(vectorOverlayGroup);
      }

      const mapContainer = document.getElementById("map");
      if (mode === "vector") {
        mapContainer.style.background = "#f8fafc";
        if (!vectorOverlayGroup) vectorOverlayGroup = buildBerkeleyVectorGrid();
        vectorOverlayGroup.addTo(map);
      } else {
        mapContainer.style.background = "#e2e8f0";
        const cfg = TILE_PROVIDERS[mode] || TILE_PROVIDERS.usgs;
        currentTileLayer = L.tileLayer(cfg.url, cfg.options).addTo(map);
        currentTileLayer.on("tileerror", () => {
          if (vectorOverlayGroup && !map.hasLayer(vectorOverlayGroup)) {
            vectorOverlayGroup.addTo(map);
          }
        });
      }
    }

    function initBasemapLayers() {
      vectorOverlayGroup = buildBerkeleyVectorGrid();
      const selectEl = document.getElementById("basemapSelect");
      setBasemap(selectEl ? selectEl.value : "usgs");
    }

      document.getElementById("countMed").textContent = RESTAURANTS.filter(r => r.isMediterranean).length;
      document.getElementById("countWalk").textContent = RESTAURANTS.filter(r => r.walkable).length;
    }

    function getFilteredRestaurants() {
      return RESTAURANTS.filter(item => {
        if (currentFilter === "open3pm" && !item.openAt3pm) return false;
        if (currentFilter === "biryani" && !item.hasBiryani) return false;
        if (currentFilter === "mediterranean" && !item.isMediterranean) return false;
        if (currentFilter === "walkable" && !item.walkable) return false;

        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const hay = `${item.name} ${item.cuisine} ${item.address} ${item.highlight}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function selectSpot(id, panMap = true) {
      activeSpotId = id;
      const item = RESTAURANTS.find(r => r.id === id);

      Object.keys(markersById).forEach(rid => {
        const rObj = RESTAURANTS.find(r => r.id === rid);
        if (rObj && markersById[rid]) {
          markersById[rid].setIcon(createPinIcon(rObj, rid === id));
        }
      });

      document.querySelectorAll(".spot-card").forEach(card => {
        if (card.dataset.id === id) {
          card.classList.add("ring-2", "ring-amber-500", "bg-amber-50/40");
        } else {
          card.classList.remove("ring-2", "ring-amber-500", "bg-amber-50/40");
        }
      });

      if (item && map) {
        drawRouteLineTo(item);
        updateBanner(item);
        if (panMap && markersById[id]) {
          setDrawerOpen(false);
          map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 15), {
            duration: 0.55
          });
          markersById[id].openPopup();
        }
      }
    }

    function renderAll() {
      const filtered = getFilteredRestaurants();
      const listEl = document.getElementById("spotList");
      const statusEl = document.getElementById("resultsStatus");
      const drawerBadge = document.getElementById("drawerCountBadge");

      statusEl.textContent = `Showing ${filtered.length} of ${RESTAURANTS.length} spots (closest first)`;
      drawerBadge.textContent = filtered.length;

      Object.values(markersById).forEach(m => map.removeLayer(m));
      markersById = {};

      filtered.forEach(item => {
        const isSelected = item.id === activeSpotId;
        const marker = L.marker([item.lat, item.lng], {
          icon: createPinIcon(item, isSelected),
          zIndexOffset: isSelected ? 1000 : 100
        }).addTo(map);

        marker.bindPopup(buildPopupHtml(item));
        marker.on("click", () => {
          selectSpot(item.id, false);
        });
        markersById[item.id] = marker;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-10 px-4 text-slate-500 text-xs">
            No spots match this filter. Tap <strong>All</strong> above to reset.
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const meta = CATEGORY_META[item.categoryType];
        const isSelected = item.id === activeSpotId;
        return `
          <div data-id="${item.id}" class="spot-card group cursor-pointer rounded-xl border border-slate-200 p-3 transition hover:border-slate-300 hover:shadow-sm bg-white ${isSelected ? 'ring-2 ring-amber-500 bg-amber-50/40' : ''}">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center shrink-0" style="background:${meta.pinBg}">
                  ${item.rank}
                </span>
                <div>
                  <h3 class="font-bold text-xs sm:text-sm text-slate-900 group-hover:text-blue-600 transition">${item.name}</h3>
                  <p class="text-[11px] text-slate-500">${item.cuisine} · <span class="text-amber-600 font-semibold">${item.rating}</span></p>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-100 text-slate-700 shrink-0">
                ${item.travelText}
              </span>
            </div>

            <p class="mt-1.5 text-xs text-slate-700 leading-snug">
              ${item.highlight}
            </p>

            <div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[11px]">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${meta.badgeBg}">${meta.label}</span>
              <div class="flex items-center gap-2 shrink-0">
                <a href="${item.website}" target="_blank" rel="noopener noreferrer" class="spot-ext-link text-slate-600 hover:text-slate-900 font-medium underline">Site</a>
                <a href="${item.directionsUrl}" target="_blank" rel="noopener noreferrer" class="spot-ext-link inline-flex items-center gap-1 px-2 py-0.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold">
                  Route ↗
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll(".spot-card").forEach(card => {
        card.addEventListener("click", (e) => {
          if (e.target.closest(".spot-ext-link")) return;
          selectSpot(card.dataset.id, true);
        });
      });
    }

    function fitVisibleMarkers() {
      if (!map) return;
      const filtered = getFilteredRestaurants();
      const latLngs = [[ORIGIN.lat, ORIGIN.lng]];
      filtered.forEach(item => latLngs.push([item.lat, item.lng]));
      if (latLngs.length > 1) {
        const bounds = L.latLngBounds(latLngs);
        map.fitBounds(bounds, { paddingTopLeft: [30, 80], paddingBottomRight: [30, 60], maxZoom: 15 });
      } else {
        map.setView([ORIGIN.lat, ORIGIN.lng], 15);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateFilterCounts();
      initMap();

      // View switcher buttons
      document.getElementById("tabMapBtn").addEventListener("click", () => setDrawerOpen(false));
      document.getElementById("tabListBtn").addEventListener("click", () => setDrawerOpen(true));
      document.getElementById("closeDrawerBtn").addEventListener("click", () => setDrawerOpen(false));

      // Filter pills
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.filter;
          document.querySelectorAll(".filter-btn").forEach(b => {
            b.classList.remove("bg-slate-900", "text-white", "ring-2", "ring-slate-900");
          });
          btn.classList.add("ring-2", "ring-slate-900");
          renderAll();
          fitVisibleMarkers();
        });
      });

      // Search input inside drawer
      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderAll();
      });

      // Reset view button
      document.getElementById("resetViewBtn").addEventListener("click", () => {
        activeSpotId = null;
        if (routeLine) {
          map.removeLayer(routeLine);
          routeLine = null;
        }
        updateBanner(null);
        map.closePopup();
        setDrawerOpen(false);
        renderAll();
        fitVisibleMarkers();
      });

      // Close active spot banner
      document.getElementById("closeBannerBtn").addEventListener("click", () => {
        updateBanner(null);
      });

      // Walk ring toggle
      document.getElementById("toggleRings").addEventListener("change", (e) => {
        if (e.target.checked) {
          walkCircle.addTo(map);
        } else {
          map.removeLayer(walkCircle);
        }
      });

      // Route line toggle
      document.getElementById("toggleRouteLine").addEventListener("change", () => {
        const item = RESTAURANTS.find(r => r.id === activeSpotId);
        drawRouteLineTo(item);
      });

      // Basemap selector
      document.getElementById("basemapSelect").addEventListener("change", (e) => {
        setBasemap(e.target.value);
      });
    });
  </script>
</body>
</html>
